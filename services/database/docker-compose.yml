services:
  postgres:
    image: postgres:16-alpine
    container_name: qa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-qa_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretPassword123}
      POSTGRES_DB: ${DB_NAME:-qa_system_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qa_admin} -d ${DB_NAME:-qa_system_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: qa_postgres_data
