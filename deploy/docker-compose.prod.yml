services:
  nginx:
    image: nginx:alpine
    container_name: qa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  web:
    build:
      context: ../services/qa-web
      dockerfile: Dockerfile
    container_name: qa_web
    restart: unless-stopped
    env_file:
      - ../services/qa-web/.env
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: qa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-qa_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretPassword123}
      POSTGRES_DB: ${DB_NAME:-qa_system_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    container_name: qa_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
    name: qa_postgres_data
  miniodata:
    name: qa_minio_data
